name: cron-job-search

on:
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run digest script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          APIFY_TOKEN_5: ${{ secrets.APIFY_TOKEN_5 }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          COMPANY_EXCLUDE: ${{ vars.COMPANY_EXCLUDE }}
          SEARCH_LOCATIONS: ${{ vars.SEARCH_LOCATIONS }}
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS }}
          MAIL_BATCH_SIZE: ${{ vars.MAIL_BATCH_SIZE }}
          SEND_EMPTY_DIGEST: ${{ vars.SEND_EMPTY_DIGEST }}
        run: node job-digest.js